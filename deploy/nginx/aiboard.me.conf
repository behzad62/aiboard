server {
    listen 80;
    listen [::]:80;
    server_name aiboard.me www.aiboard.me;

    root /var/www/aiboard.me;
    index index.html;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A static export leaves same-named folders with no index, so /remote/ must
    # redirect to /remote instead of answering 403. Relative, because TLS ends
    # before this server. Every route is a real file: there is no client-side
    # routing to fall back to, so an unknown address is a real 404.
    absolute_redirect off;
    error_page 404 /404.html;

    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
