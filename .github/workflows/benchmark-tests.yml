name: Benchmark Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  benchmark:
    name: Certified benchmark checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.18.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Acquire pinned Recoverable Job Service Runner source
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          npm run publish-downloads 2>&1 | tee benchmark-results/publish-downloads.log
          npm run test:certified 2>&1 | tee benchmark-results/test-certified.log
          npm run test:benchmark 2>&1 | tee benchmark-results/test-benchmark.log
          npm run test:benchmark:recoverable-job-service 2>&1 | tee benchmark-results/test-recoverable-job-service.log
          npm run build 2>&1 | tee benchmark-results/build.log

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmark-results/
          if-no-files-found: warn
