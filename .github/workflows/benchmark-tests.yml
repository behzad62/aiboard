name: Benchmark Tests

# Benchmarks are not worth a full run on every change: Runner-only, docs-only and other-workflow changes skip it here
# (Runner V2 portable execution covers the Runner), and the nightly run catches anything those changes break here.
on:
  pull_request:
    paths-ignore:
      - "runner-v2/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/runner-*.yml"
      - ".github/workflows/funboard-*.yml"
      - ".github/workflows/deploy-aiboard.yml"
  push:
    branches: [main]
    paths-ignore:
      - "runner-v2/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/runner-*.yml"
      - ".github/workflows/funboard-*.yml"
      - ".github/workflows/deploy-aiboard.yml"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

# A newer push to the same pull request cancels the run it replaces; other runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Certified benchmark checks (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.18.0]
        # These run in parallel. suite-1..3 together run npm run test:benchmark: scripts/ci-npm-script-shard.mjs gives
        # each of its commands to exactly one shard (the RJS bundle test, about 2.5 minutes, gets one to itself).
        # qualification is the RJS qualification, the site build and the native browser profile.
        part: [suite-1, suite-2, suite-3, qualification]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"

      # node_modules exactly as npm ci left it, keyed by OS, CPU, Node version and lockfile. npm ci runs only when
      # no saved copy matches, and its result is saved before any test runs.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save installed dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # The RJS bundle test (suite) and the native browser profile (qualification) both need Chromium. The bundle pins
      # the repository's Playwright version, so its own setup:browser finds this browser instead of downloading another.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps installs Linux system packages; on Windows it only adds Windows Server features (about 3 minutes).
      - name: Install the Playwright browser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi

      - name: Run benchmark suite shard
        if: startsWith(matrix.part, 'suite-')
        shell: bash
        env:
          SHARD: ${{ matrix.part }}
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          npm run publish-downloads 2>&1 | tee benchmark-results/publish-downloads.log
          node scripts/ci-npm-script-shard.mjs test:benchmark --shard "${SHARD#suite-}/3" 2>&1 | tee benchmark-results/test-benchmark.log

      - name: Run RJS qualification and build
        if: matrix.part == 'qualification'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p benchmark-results
          npm run publish-downloads 2>&1 | tee benchmark-results/publish-downloads.log
          npm run test:benchmark:rjs-qualification 2>&1 | tee benchmark-results/test-recoverable-job-service.log
          # --ignore-scripts skips the prebuild hook, which would publish the downloads a second time.
          npm run build --ignore-scripts 2>&1 | tee benchmark-results/build.log

      - name: Verify native ToolBench browser profile
        if: matrix.part == 'qualification'
        run: npm run test:benchmark:native-browser

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.part }}
          path: benchmark-results/
          if-no-files-found: warn
