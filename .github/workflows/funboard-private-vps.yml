name: FunBoard Private VPS Container

# Installed in the owner's existing AIboard GitHub repository. Manual only.
# Closed-source FunBoard images are built locally, staged via private SCP and
# never uploaded as GitHub source code, release assets or CI artifacts.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SSH/sudo preflight, first-time deploy, or guarded recovery of interrupted first deploy"
        required: true
        type: choice
        options: [preflight, deploy, resume]
        default: preflight
      release_tag:
        description: "Approved 12-character lowercase release Git SHA"
        type: string
        required: false
      archive_sha256:
        description: "SHA-256 of staged image.tar.gz (deploy only)"
        type: string
        required: false
      compose_sha256:
        description: "SHA-256 of staged compose-fixed.yaml (resume only)"
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: funboard-private-vps
  cancel-in-progress: false

jobs:
  deploy-private:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate existing secrets point only to the approved VPS
        shell: bash
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          if [[ "$HOST" != "178.79.134.104" || "$PORT" != "3192" || "$USER" != "pixel" ]]; then
            echo "Existing SSH secrets do not match the authorized VPS. Refusing connection."
            exit 1
          fi
          echo "Approved SSH destination confirmed."

      - name: Perform VPS preflight, first install, or guarded CPU-limit recovery
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          COMPOSE_SHA256: ${{ inputs.compose_sha256 }}
          SUDO_PASSWORD: ${{ secrets.SSH_PASS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATEKEY }}
          passphrase: ${{ secrets.SSH_KEYPASS }}
          envs: MODE,RELEASE_TAG,ARCHIVE_SHA256,COMPOSE_SHA256,SUDO_PASSWORD
          command_timeout: 14m
          # Bash set -euo pipefail already provides failure handling for this script.
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            sudo_safe() {
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
            }
            test "$(id -un)" = pixel
            sudo_safe true >/dev/null
            echo "SSH authentication and GitHub sudo authorization OK."
            sudo_safe docker version --format 'Docker server: {{.Server.Version}}'
            sudo_safe nginx -t >/dev/null
            echo "ACTIVE_MODE=$MODE"
            if [ "$MODE" = preflight ]; then
            echo "ACTION_MODE=$MODE"
              echo "FUNBOARD_PREFLIGHT_OK: no changes made."
              exit 0
            fi

            [ "$MODE" = deploy ] || [ "$MODE" = resume ] || { echo "Unsupported mode"; exit 1; }
            [[ "$RELEASE_TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "Invalid release tag"; exit 1; }
            stage="$HOME/funboard-release-staging/$RELEASE_TAG"
            test -d "$stage" && test ! -L "$stage"
            echo "STAGING_DIR_OK"

            if [ "$MODE" = deploy ]; then
              [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid image checksum"; exit 1; }
              archive="$stage/image.tar.gz"
              test -f "$archive" && test -f "$stage/compose.yaml" && test -f "$stage/funboard.env.example"
              test ! -L "$archive" && test ! -L "$stage/compose.yaml" && test ! -L "$stage/funboard.env.example"
              printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --status
              echo "Staged image checksum verified."
              if [ -e /opt/funboard/compose.yaml ] || sudo_safe test -e /etc/funboard/funboard.env || [ -e /var/lib/funboard/funboard.sqlite ]; then
                echo "Existing FunBoard deployment detected. Refusing first-install overwrite."
                exit 1
              fi
              if ss -lnt | grep -Eq '[:.]3180[[:space:]]'; then
                echo "FunBoard local-only port 3180 is already in use."
                exit 1
              fi
              sudo_safe install -d -m 0755 /opt/funboard
              sudo_safe install -d -m 0700 /etc/funboard
              sudo_safe install -d -o 1000 -g 1000 -m 0700 /var/lib/funboard
              sudo_safe install -m 0644 "$stage/compose.yaml" /opt/funboard/compose.yaml
              sudo_safe install -m 0600 "$stage/funboard.env.example" /etc/funboard/funboard.env
              sudo_safe docker load --input "$archive"
            else
              echo "ENTERED_RESUME_BRANCH"
              # One-off recovery of initial 1.5 CPU limit rejected on this 1-CPU VPS.
              # Only the audited Compose file changes; DO NOT touch env, DB or user records.
              [ "$RELEASE_TAG" = "c530e43470ef" ] || { echo "Unexpected recovery release"; exit 1; }
              echo "PINNED_RELEASE_OK"
              [[ "$COMPOSE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid replacement Compose hash"; exit 1; }
              echo "REPLACEMENT_HASH_FORMAT_OK"
              [ "$COMPOSE_SHA256" = "48d0c6b037bd58f57f96995dfa284c7dd8ccea780a795130cffea5ef23652ab5" ] || {
                echo "Unexpected recovery Compose content digest"; exit 1;
              }
              echo "REPLACEMENT_HASH_PINNED_OK"
              fixed="$stage/compose-fixed.yaml"
              echo "REMOTE_HOME=$HOME"
              echo "FILE_EXISTS=$([ -f "$fixed" ] && echo yes || echo no) IS_SYMLINK=$([ -L "$fixed" ] && echo yes || echo no)"
              ls -ld "$stage" "$fixed" || true
              test -f "$fixed" && test ! -L "$fixed"
              echo "FIXED_FILE_OK"
              printf '%s  %s\n' "$COMPOSE_SHA256" "$fixed" | sha256sum --check --status
              echo "Corrected Compose checksum verified."
              echo "FIXED_SHA_OK"
              installed="$(sha256sum /opt/funboard/compose.yaml | awk '{print $1}')"
              [ "$installed" = "2185268f341f17df3bd6d5237192dcb25300ed3a6700c55b26678d56c91818b6" ] || {
                echo "Existing Compose differs from the audited pre-failure config. No overwrite."; exit 1;
              }
              sudo_safe test -f /etc/funboard/funboard.env
              sudo_safe test -d /var/lib/funboard
              echo "SECRET_FILE_AND_DATA_DIR_GUARDS_OK"
              if ! sudo_safe test ! -e /var/lib/funboard/funboard.sqlite; then
                echo "Database already exists: this recovery must not touch it."; exit 1;
              fi
              if sudo_safe docker inspect funboard-beta >/dev/null 2>&1; then
                echo "An existing FunBoard container is present; refusing replacement."; exit 1;
              fi
              if ss -lnt | grep -Eq '[:.]3180[[:space:]]'; then
                echo "Local-only port 3180 is occupied; refusing replacement."; exit 1;
              fi
              image_id="$(sudo_safe docker image inspect "funboard-beta:$RELEASE_TAG" --format '{{.Id}}')"
              [ "$image_id" = "sha256:14f56f507d83882a8923d15bab47d8ffe2fd567dd4853b985a318c10e8e25dd9" ] || {
                echo "Unexpected loaded Docker image; refusing replacement."; exit 1;
              }
              sudo_safe install -m 0644 "$fixed" /opt/funboard/compose.yaml
              echo "Guarded one-off CPU-limit fix applied without touching secrets or SQLite."
            fi

            sudo_safe docker image inspect "funboard-beta:$RELEASE_TAG" --format 'Verified image {{.Id}}'
            sudo_safe env FUNBOARD_RELEASE_TAG="$RELEASE_TAG" docker compose -f /opt/funboard/compose.yaml config --quiet
            sudo_safe env FUNBOARD_RELEASE_TAG="$RELEASE_TAG" docker compose -f /opt/funboard/compose.yaml up -d --no-build --no-deps
            healthy=0
            for i in $(seq 1 36); do
              if curl -fsS --max-time 3 http://127.0.0.1:3180/api/health >/dev/null 2>&1; then healthy=1; break; fi
              sleep 3
            done
            [ "$healthy" = 1 ] || { echo "Container health check failed; operator review required."; exit 1; }
            bound="$(sudo_safe docker port funboard-beta 3100/tcp | tr -d '\r')"
            if [ "$bound" != "127.0.0.1:3180" ]; then
              echo "Unexpected network exposure; stopping FunBoard."
              sudo_safe docker stop funboard-beta >/dev/null
              exit 1
            fi
            sudo_safe docker stats --no-stream --format 'FunBoard {{.MemUsage}} / {{.CPUPerc}}' funboard-beta
            systemctl is-active --quiet nginx
            systemctl is-active --quiet mysql
            sudo_safe nginx -t >/dev/null
            echo "FUNBOARD_DEPLOY_OK: localhost only; existing Nginx and MySQL preserved."
