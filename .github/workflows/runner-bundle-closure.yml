name: Runner bundle closure

# The release bundle ships the git-tracked runner-v2/src plus a few peer files
# (scripts/release/bundle-contents.mts). A new or changed source file can import
# something the bundle leaves out; runner-installer.yml only runs on release paths,
# so #168 reached the release before this check saw it. This runs the same static
# check on every PR that changes a shipped file. It needs no build and takes seconds.
on:
  pull_request:
    paths:
      - "runner-v2/src/**"
      - "lib/account-provider-runner.mjs"
      - "lib/account-provider-copilot-sdk.mjs"
      - "scripts/local-pair-runner.mjs"
      - "scripts/runner.mjs"
      - "scripts/runner-lib.mjs"
      - "scripts/runner-panel.html"
      - "scripts/runner-help.html"
      - "scripts/release/bundle-contents.mts"
      - "scripts/release/test-bundle-closure.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runner-bundle-closure.yml"
      # The Runner's model catalog snapshot (runner-v2/src/generated/model-catalog.ts) is generated from
      # these web files, so a change to any of them must regenerate it (packet HM2).
      - "lib/providers/**"
      - "lib/client/native-build-engine.ts"
      - "lib/client/providers.ts"
      - "scripts/generate-runner-model-catalog.mts"
      - "scripts/test-runner-model-catalog-parity.mts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: Bundle import closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node (release builder pin)
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      # node_modules exactly as npm ci left it, keyed by OS, CPU, Node version and lockfile. npm ci runs only when
      # no saved copy matches, and its result is saved before any check runs.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Every shipped import is shipped
        run: node node_modules/tsx/dist/cli.mjs scripts/release/test-bundle-closure.mts
      - name: The Runner's model catalog snapshot is current
        run: node node_modules/tsx/dist/cli.mjs scripts/generate-runner-model-catalog.mts --check
      - name: The Runner's model rules equal the web's
        run: node node_modules/tsx/dist/cli.mjs scripts/test-runner-model-catalog-parity.mts
