name: Runner V2 portable execution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification-scope:
        description: 'Bounded diagnostic scope. t8-portable-coverage runs only the T8 affected portable job plus scoped probe steps; suppressed jobs are UNQUALIFIED (not PASS) and this probe cannot qualify T8. full preserves full 13-job acceptance. windows-factory-diagnostic runs only the Windows factory probe; windows-active-job-diagnostic measures one original active Job probe with an experimental 5s bound. Neither qualifies T8, Win123, types/chat, shipping, or full. windows-duplex-passive-diagnostic selects ONE unchanged Windows portable duplex with passive trace; all outcomes and suppressed jobs remain UNQUALIFIED. windows-benchmark-startup-diagnostic selects ONE original extracted WorkBench startup script with passive facts; every outcome remains UNQUALIFIED.'
        required: false
        default: full
        type: choice
        options:
          - full
          - t8-portable-coverage
          - windows-factory-diagnostic
          - windows-active-job-diagnostic
          - windows-duplex-passive-diagnostic
          - windows-benchmark-startup-diagnostic

permissions:
  contents: read

jobs:
  portable-contract:
    name: Portable contract (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic' && inputs['qualification-scope'] != 'windows-duplex-passive-diagnostic' && inputs['qualification-scope'] != 'windows-benchmark-startup-diagnostic')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic portable contract
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/process-backend-contract.test.ts
          runner-v2/test/runner-capabilities-config.test.ts
          runner-v2/test/runner-capability-contract.test.ts
          runner-v2/test/plugin-loader.test.ts
          runner-v2/test/qualification-harness.test.ts
          runner-v2/test/async-failure-observer.test.ts
          runner-v2/test/windows-job-status-fencing.test.ts
          runner-v2/test/native-build-manager.test.ts
          runner-v2/test/native-build-manager-readers.test.ts
          runner-v2/test/runner-resource-cleanup.test.ts
          runner-v2/test/static-adapter-policy.test.ts
          runner-v2/test/windows-job-active-probe.test.ts
          runner-v2/test/native-build-rollback-order.test.ts
      - name: Run OCI canonical path contracts
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/oci-canonical-paths.test.ts
      - name: Run A1 terminal capture contracts
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/a1-terminal-capture.test.ts
          runner-v2/test/owned-fixture-teardown.test.ts
          runner-v2/test/planning-ui-fixture.test.ts
      - name: Run targeted legacy CLI fixture regressions
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          --test-name-pattern="CLI rejects an active legacy Build without a capability contract before listening|CLI records an unsupported persisted execution-safety version as a per-run capability refusal"
          runner-v2/test/cli-capabilities-config.test.ts
      - name: Run portable input acknowledgement deadline contracts on Windows
        if: runner.os == 'Windows'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          --test-name-pattern="^portable command deadline reconciles durable acknowledgement "
          runner-v2/test/portable-process-channel.test.ts
      - name: Run owned-fence protocol and channel contracts on POSIX hosts
        if: runner.os != 'Windows'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/portable-process-protocol.test.ts
          runner-v2/test/portable-process-channel.test.ts
      - name: Run targeted legacy POSIX lifecycle observation regression
        if: runner.os != 'Windows'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          --test-name-pattern="POSIX native session fixture owns descendants after launcher exit"
          runner-v2/test/posix-process-backend.test.ts

  native-smoke:
    name: Native adapter probe (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic' && inputs['qualification-scope'] != 'windows-duplex-passive-diagnostic' && inputs['qualification-scope'] != 'windows-benchmark-startup-diagnostic')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Probe the host-native adapter without lifecycle timing assertions
        run: node node_modules/tsx/dist/cli.mjs scripts/runner-v2-native-smoke.mts

  package-gate:
    name: Package parity (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic' && inputs['qualification-scope'] != 'windows-duplex-passive-diagnostic' && inputs['qualification-scope'] != 'windows-benchmark-startup-diagnostic')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Prove package/archive and installed entrypoint parity
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/package-parity.test.ts
          runner-v2/test/runner-entrypoints.test.ts
          runner-v2/test/node-version.test.ts
          runner-v2/test/portable-execution-workflow.test.ts
      - name: Publish archives for cross-host checksum
        run: node scripts/publish-downloads.mjs --output-dir runner-v2-ci-package
      - name: Record cross-host package hashes
        run: >-
          node scripts/runner-v2-package-hashes.mjs write
          --input-dir runner-v2-ci-package
          --output runner-v2-package-hashes-${{ matrix.os }}.json
          --label ${{ matrix.os }}
      - name: Upload cross-host package hashes
        uses: actions/upload-artifact@v4
        with:
          name: runner-v2-package-hashes-${{ matrix.node-version }}-${{ matrix.os }}
          path: runner-v2-package-hashes-${{ matrix.os }}.json
          if-no-files-found: error

  package-cross-host:
    name: Cross-host package reproducibility (Node ${{ matrix.node-version }})
    needs: package-gate
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic' && inputs['qualification-scope'] != 'windows-duplex-passive-diagnostic' && inputs['qualification-scope'] != 'windows-benchmark-startup-diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download package hash reports
        uses: actions/download-artifact@v4
        with:
          pattern: runner-v2-package-hashes-${{ matrix.node-version }}-*
          path: runner-v2-cross-host-hashes
          merge-multiple: true
      - name: Compare package hashes across maintained hosts
        run: >-
          node scripts/runner-v2-package-hashes.mjs compare
          --input-dir runner-v2-cross-host-hashes
          --expected-labels windows-latest,ubuntu-latest,macos-latest

  t8-portable-coverage:
    name: T8 portable coverage (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name != 'workflow_dispatch' || inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic' && inputs['qualification-scope'] != 'windows-duplex-passive-diagnostic' && inputs['qualification-scope'] != 'windows-benchmark-startup-diagnostic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run T8 affected portable filesystem grant patch broker coverage
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/execution-grants.test.ts
          runner-v2/test/filesystem-mutation-fence.test.ts
          runner-v2/test/filesystem-mutation-routing.test.ts
          runner-v2/test/filesystem-tools.test.ts
          runner-v2/test/openrouter-apply-patch-tool.test.ts
          runner-v2/test/tool-broker.test.ts
          runner-v2/test/openrouter-apply-patch-factory.test.ts
          runner-v2/test/git-fixture-canonical-root.test.ts
          runner-v2/test/npm-installed-profile.test.ts
      - name: Typecheck Runner V2 (t8-portable-coverage probe only)
        if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 't8-portable-coverage'
        run: npm run typecheck:runner-v2
      - name: Run scoped account-provider chat 21->22 stale-health target (t8-portable-coverage probe only)
        if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 't8-portable-coverage'
        run: node node_modules/tsx/dist/cli.mjs scripts/test-account-provider-runner-chat.mts

  windows-factory-diagnostic:
    name: Windows factory diagnostic (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 'windows-factory-diagnostic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run Windows factory diagnostic probe (single run)
        env:
          RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT: ${{ runner.temp }}/t8-factory-diagnostic-evidence
          RUNNER_V2_FACTORY_PROBE_OBSERVER: '1'
        run: node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1 runner-v2/test/openrouter-apply-patch-factory.test.ts
      - name: Upload Windows factory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-factory-diagnostic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t8-factory-diagnostic-evidence
          if-no-files-found: warn
          retention-days: 14

  windows-active-job-diagnostic:
    name: Windows active Job 5s experiment (Node 24.x)
    if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 'windows-active-job-diagnostic'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Measure one original active Job probe under a bounded 5s deadline
        env:
          RUNNER_V2_ACTIVE_JOB_DIAGNOSTIC_ROOT: ${{ runner.temp }}/t8-active-job-experiment-evidence
        run: node node_modules/tsx/dist/cli.mjs scripts/diagnose-windows-active-job.mts
      - name: Upload bounded probe experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-active-job-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t8-active-job-experiment-evidence
          if-no-files-found: error
          retention-days: 14

  windows-duplex-passive-diagnostic:
    name: UNQUALIFIED Windows portable duplex passive diagnostic (Node 24.x)
    if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 'windows-duplex-passive-diagnostic'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT: ${{ github.workspace }}/qualification-evidence
    steps:
      - name: Checkout exact reviewed diagnostic ref
        uses: actions/checkout@v4
      - name: Setup maintained Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bind original source and installed observer composition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = @{
            'runner-v2/src/portable-process-supervisor.mjs' = '5e1b32639a940f2d1b6646b8177df3ad8c83b853f04db8544daa70b03d962ea9'
            'runner-v2/src/portable-process-channel.ts' = '2b7be0b87e7a1521c4d6276ab0d3763c2a1d56ab80f1461d76d5b9cdea54c7ff'
            'runner-v2/src/native-process-backend.ts' = 'c45a697ee8ae77103e3b2c6bae340c9c13294422ac4a0a64a289b3d9777b1553'
            'runner-v2/src/portable-process-protocol.mjs' = '6f25843bbafe46641bcefead1e1815a7f3934fb3a81533a9bdd96cc17f6d93f0'
            'runner-v2/src/owned-fence-lock.mjs' = '160afe983b8dc56934b2fc4a5973fe5249419b34b662f3ac8725a6fede18c311'
            'runner-v2/src/windows-birth-inspection.mjs' = 'c3e26d53d4126c00f6f50d9bbc21b17ea4fd49c43f488a67daf67dd8b187fdc2'
            'runner-v2/test/qualification/scenarios/windows-portable.ts' = 'f59d48a345340e5e4180b70da7ecd29f7cfbf3fd218c724e7cd0512318162472'
            'runner-v2/test/qualification/windows-portable-channel.test.ts' = 'bfec65b4fb639958908ec433de5d638271784fafd9669f09af0e82213cb721a7'
            'runner-v2/test/support/qualification-harness.ts' = '7067deaa3e9674d65f91a6624bdc258263b6f09b105c940224004f40a70a0217'
            'runner-v2/test/support/qualification-process-fixture.ts' = '327f6e54fd22ed5948a65a7557940e1bbcc86e9b963a98e3dee7d6e7b19d84ff'
            'runner-v2/test/support/inspection-fixture.ts' = 'b2e97e838b2cb54b89e62b057654ad7c8aeb0cd9a8de87c44c23677a3d1ea6c3'
            'node_modules/tsx/dist/cli.mjs' = '8420e19483e82bf21d984fbb9aad752df9e83dfeec3237fef5e62f5546d45ec9'
            'runner-v2/test/support/portable-duplex-diagnostic.cjs' = 'eb1483caac3f616d5a490955a1e4e332b8c33c52a8e65c751bd3a98bbe32c7bd'
            'runner-v2/test/support/portable-duplex-trace-validator.cjs' = '8e2fe22273578e1268957937345b73e91b005867e16e73a3681d08237a058a01'
          }
          $observed = @{}
          foreach ($entry in $pins.GetEnumerator()) {
            $rawHash = (Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
            $text = $strictUtf8.GetString([System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $entry.Key))).Replace("`r`n", "`n")
            $canonicalBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($text)
            $actual = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($canonicalBytes)).ToLowerInvariant()
            if ($actual -cne $entry.Value) { throw "Diagnostic source pin mismatch: $($entry.Key)" }
            $observed[$entry.Key] = @{ rawSha256 = $rawHash; canonicalLfSha256 = $actual }
          }
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $nodeVersion = (& $node --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -notmatch '^v24\.') { throw 'Maintained Node 24.x required' }
          $npmVersion = (& npm --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'npm version capture failed' }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:GITHUB_SHA) { throw 'Checkout identity mismatch' }
          $root = [System.IO.Path]::GetFullPath($env:RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT)
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          @{ qualification = 'UNQUALIFIED'; sourceBase = '361be91bf0687c0111cf8c37b249dbf0953c7f3c'; commit = $commit; nodeVersion = $nodeVersion; npmVersion = $npmVersion; nodeSha256 = (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant(); runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; sourcePins = $observed; selected = 'qualification: portable-duplex'; originalBoundsMs = @{ outer = 180000; isolated = 120000; write = 2000; refresh = 5000; streams = 5000 } } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $root 'diagnostic-instance.json') -Encoding utf8
      - name: Observe ONE original duplex; supplemental UNQUALIFIED evidence
        shell: pwsh
        env:
          T8_PASSIVE_DUPLEX_DIAGNOSTIC: '1'
        run: |
          $preload = (Resolve-Path -LiteralPath 'runner-v2/test/support/portable-duplex-diagnostic.cjs').Path
          $tsx = (Resolve-Path -LiteralPath 'node_modules/tsx/dist/cli.mjs').Path
          $test = (Resolve-Path -LiteralPath 'runner-v2/test/qualification/windows-portable-channel.test.ts').Path
          & node --require $preload $tsx --test --test-concurrency=1 '--test-name-pattern=^qualification: portable-duplex$' $test
          $nativeExit = $LASTEXITCODE
          @{ qualification = 'UNQUALIFIED'; exitCode = $nativeExit } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT 'diagnostic-command-result.json') -Encoding utf8
          exit $nativeExit
      - name: Require complete admitted-role trace (does not qualify native outcome)
        if: always()
        run: node runner-v2/test/support/portable-duplex-trace-validator.cjs
      - name: Upload diagnostic instance and passive traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UNQUALIFIED-windows-duplex-passive-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-evidence
          if-no-files-found: error
          retention-days: 14

  windows-benchmark-startup-diagnostic:
    name: Windows extracted benchmark startup diagnostic (UNQUALIFIED, Node 24.18.0)
    if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 'windows-benchmark-startup-diagnostic'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic instance
        uses: actions/checkout@v4
      - name: Setup certified Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run one original extracted benchmark startup diagnostic
        run: node scripts/support/benchmark-startup-diagnostic-driver.cjs
      - name: Retain original output and bounded startup facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-benchmark-startup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-startup-diagnostic-results/
          if-no-files-found: error
          retention-days: 14
