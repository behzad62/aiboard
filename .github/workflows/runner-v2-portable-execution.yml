name: Runner V2 portable execution

on:
  pull_request:
    # Docs-only and web-only pull requests skip this workflow; everything else runs it, Runner code, scripts, the
    # lockfile and this workflow included. Later patterns win: the files after the exclusions are web or docs files a
    # portable test or the publisher reads, and runner-v2/test/portable-execution-workflow.test.ts fails when a
    # portable test reads one that this list leaves out. Pushes to main always run everything.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!app/**"
      - "!components/**"
      - "!lib/**"
      - "!tests/**"
      - "!.github/workflows/benchmark-tests.yml"
      - "!.github/workflows/deploy-aiboard.yml"
      - "!.github/workflows/funboard-*.yml"
      - "runner-v2/**"
      - "TRADEMARKS.md"
      - "docs/runner-v2/architecture.md"
      - "app/discussion/discussion-client.tsx"
      - "lib/account-provider-*.mjs"
      - "lib/client/discussion-live-state.ts"
      - "lib/db/schema.ts"
      - "tests/e2e/runner-v2-t8-planning-journey.spec.ts"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification-scope:
        description: 'Bounded diagnostic scope. t8-portable-coverage runs only the T8 affected portable job plus scoped probe steps; suppressed jobs are UNQUALIFIED (not PASS) and this probe cannot qualify T8. full preserves full 13-job acceptance. windows-factory-diagnostic runs only the Windows factory probe; windows-active-job-diagnostic measures one original active Job probe with an experimental 5s bound. Neither qualifies T8, Win123, types/chat, shipping, or full.'
        required: false
        default: full
        type: choice
        options:
          - full
          - t8-portable-coverage
          - windows-factory-diagnostic
          - windows-active-job-diagnostic

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each job below runs in parallel parts (matrix.part), so no part waits for another's tests. Every step still runs
  # on the same hosts as before; a part only decides which job it runs in.
  portable-contract:
    name: Portable contract (${{ matrix.os }}, Node ${{ matrix.node-version }}, ${{ matrix.part }})
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
        # input-wait is the POSIX-only T1 acceptance step, the longest one here.
        part: [contract, input-wait]
        exclude:
          - os: windows-latest
            part: input-wait
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      # node_modules exactly as npm ci left it, keyed by OS, CPU, Node version and lockfile. npm ci runs only when
      # no saved copy matches, and its result is saved before any test runs.
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Run deterministic portable contract
        if: matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/process-backend-contract.test.ts
          runner-v2/test/runner-capabilities-config.test.ts
          runner-v2/test/runner-capability-contract.test.ts
          runner-v2/test/plugin-loader.test.ts
          runner-v2/test/qualification-harness.test.ts
          runner-v2/test/async-failure-observer.test.ts
          runner-v2/test/windows-job-status-fencing.test.ts
          runner-v2/test/native-build-manager.test.ts
          runner-v2/test/native-build-manager-readers.test.ts
          runner-v2/test/runner-resource-cleanup.test.ts
          runner-v2/test/static-adapter-policy.test.ts
          runner-v2/test/windows-job-active-probe.test.ts
          runner-v2/test/native-build-rollback-order.test.ts
      - name: Run OCI canonical path contracts
        if: matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/oci-canonical-paths.test.ts
      - name: Run A1 terminal capture contracts
        if: matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/a1-terminal-capture.test.ts
          runner-v2/test/owned-fixture-teardown.test.ts
          runner-v2/test/planning-ui-fixture.test.ts
      - name: Run targeted legacy CLI fixture regressions
        if: matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          --test-name-pattern="CLI rejects an active legacy Build without a capability contract before listening|CLI records an unsupported persisted execution-safety version as a per-run capability refusal"
          runner-v2/test/cli-capabilities-config.test.ts
      - name: Run portable input acknowledgement deadline contracts on Windows
        if: runner.os == 'Windows' && matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          --test-name-pattern="^portable command deadline reconciles durable acknowledgement "
          runner-v2/test/portable-process-channel.test.ts
      - name: Run owned-fence protocol and channel contracts on POSIX hosts
        if: runner.os != 'Windows' && matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/portable-process-protocol.test.ts
          runner-v2/test/portable-process-channel.test.ts
      - name: Run targeted legacy POSIX lifecycle observation regression
        if: runner.os != 'Windows' && matrix.part == 'contract'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          --test-name-pattern="POSIX native session fixture owns descendants after launcher exit"
          runner-v2/test/posix-process-backend.test.ts
      - name: Run T1 input-wait evidence and acceptance on POSIX hosts
        if: runner.os != 'Windows' && matrix.part == 'input-wait'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/posix-process-usage.test.ts
          runner-v2/test/managed-process-wait.test.ts
          runner-v2/test/managed-process-wait-tracker.test.ts
          runner-v2/test/managed-interaction-native.test.ts

  native-smoke:
    name: Native adapter probe (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Probe the host-native adapter without lifecycle timing assertions
        run: node node_modules/tsx/dist/cli.mjs scripts/runner-v2-native-smoke.mts

  package-gate:
    name: Package parity (${{ matrix.os }}, Node ${{ matrix.node-version }}, ${{ matrix.part }})
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
        # archives publishes and checks the archives and records their hashes; install installs the packaged Runner.
        part: [archives, install]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Prove package/archive parity
        if: matrix.part == 'archives'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/package-parity.test.ts
      - name: Prove installed entrypoint parity
        if: matrix.part == 'install'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test
          runner-v2/test/runner-entrypoints.test.ts
          runner-v2/test/node-version.test.ts
          runner-v2/test/portable-execution-workflow.test.ts
      - name: Publish archives for cross-host checksum
        if: matrix.part == 'archives'
        run: node scripts/publish-downloads.mjs --output-dir runner-v2-ci-package
      - name: Record cross-host package hashes
        if: matrix.part == 'archives'
        run: >-
          node scripts/runner-v2-package-hashes.mjs write
          --input-dir runner-v2-ci-package
          --output runner-v2-package-hashes-${{ matrix.os }}.json
          --label ${{ matrix.os }}
      - name: Upload cross-host package hashes
        if: matrix.part == 'archives'
        uses: actions/upload-artifact@v7
        with:
          name: runner-v2-package-hashes-${{ matrix.node-version }}-${{ matrix.os }}
          path: runner-v2-package-hashes-${{ matrix.os }}.json
          if-no-files-found: error

  package-cross-host:
    name: Cross-host package reproducibility (Node ${{ matrix.node-version }})
    needs: package-gate
    if: github.event_name != 'workflow_dispatch' || (inputs['qualification-scope'] != 't8-portable-coverage' && inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download package hash reports
        uses: actions/download-artifact@v8
        with:
          pattern: runner-v2-package-hashes-${{ matrix.node-version }}-*
          path: runner-v2-cross-host-hashes
          merge-multiple: true
      - name: Compare package hashes across maintained hosts
        run: >-
          node scripts/runner-v2-package-hashes.mjs compare
          --input-dir runner-v2-cross-host-hashes
          --expected-labels windows-latest,ubuntu-latest,macos-latest

  t8-portable-coverage:
    name: T8 portable coverage (${{ matrix.os }}, Node ${{ matrix.node-version }}, ${{ matrix.part }})
    if: github.event_name != 'workflow_dispatch' || inputs['qualification-scope'] != 'windows-factory-diagnostic' && inputs['qualification-scope'] != 'windows-active-job-diagnostic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
        # paths holds the path guard (about 80 s of it on Windows); factory is the single native patch factory test,
        # which runs about 2 to 4 minutes on POSIX hosts and stays off Windows (below).
        part: [home-tools, paths, factory]
        exclude:
          - os: windows-latest
            part: factory
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Restore installed dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Run T8 affected portable home, grant, patch and broker coverage
        if: matrix.part == 'home-tools'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/aiboard-home-store.test.ts
          runner-v2/test/home-runtime.test.ts
          runner-v2/test/home-cli.test.ts
          runner-v2/test/control-server-home.test.ts
          runner-v2/test/model-proxy.test.ts
          runner-v2/test/execution-grants.test.ts
          runner-v2/test/filesystem-mutation-fence.test.ts
          runner-v2/test/filesystem-mutation-routing.test.ts
          runner-v2/test/filesystem-tools.test.ts
          runner-v2/test/openrouter-apply-patch-tool.test.ts
          runner-v2/test/tool-broker.test.ts
      - name: Run T8 affected portable path guard and fixture coverage
        if: matrix.part == 'paths'
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/remote-path-guard.test.ts
          runner-v2/test/git-fixture-canonical-root.test.ts
          runner-v2/test/npm-installed-profile.test.ts
      # Off on Windows by owner decision (2026-11-05): this test intermittently hangs on hosted Windows runners
      # until the job's time limit, with no cause found after many attempts, and hasn't been seen failing elsewhere.
      # To run it there by hand, dispatch this workflow with qualification-scope windows-factory-diagnostic.
      - name: Run native patch factory coverage (not on Windows)
        if: runner.os != 'Windows' && matrix.part == 'factory'
        run: node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1 runner-v2/test/openrouter-apply-patch-factory.test.ts
      - name: Typecheck Runner V2 (t8-portable-coverage probe only)
        if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 't8-portable-coverage' && matrix.part == 'home-tools'
        run: npm run typecheck:runner-v2
      - name: Run scoped account-provider chat 21->22 stale-health target (t8-portable-coverage probe only)
        if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 't8-portable-coverage' && matrix.part == 'home-tools'
        run: node node_modules/tsx/dist/cli.mjs scripts/test-account-provider-runner-chat.mts

  windows-factory-diagnostic:
    name: Windows factory diagnostic (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 'windows-factory-diagnostic'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Acquire pinned Recoverable Job Service Runner source
        shell: bash
        run: node scripts/pinned-rjs-runner-source.mjs --acquire --remote origin --expected-repository "$GITHUB_REPOSITORY" --expected-server "$GITHUB_SERVER_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run Windows factory diagnostic probe (single run)
        env:
          RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT: ${{ runner.temp }}/t8-factory-diagnostic-evidence
          RUNNER_V2_FACTORY_PROBE_OBSERVER: '1'
        run: node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1 runner-v2/test/openrouter-apply-patch-factory.test.ts
      - name: Upload Windows factory diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-factory-diagnostic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t8-factory-diagnostic-evidence
          if-no-files-found: warn
          retention-days: 14

  windows-active-job-diagnostic:
    name: Windows active Job 5s experiment (Node 24.x)
    if: github.event_name == 'workflow_dispatch' && inputs['qualification-scope'] == 'windows-active-job-diagnostic'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup maintained Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Measure one original active Job probe under a bounded 5s deadline
        env:
          RUNNER_V2_ACTIVE_JOB_DIAGNOSTIC_ROOT: ${{ runner.temp }}/t8-active-job-experiment-evidence
        run: node node_modules/tsx/dist/cli.mjs scripts/diagnose-windows-active-job.mts
      - name: Upload bounded probe experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-active-job-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t8-active-job-experiment-evidence
          if-no-files-found: error
          retention-days: 14
