name: Runner V2 hosted qualification

on:
  workflow_dispatch:
    inputs:
      job:
        description: Qualification job to run (full keeps the existing matrix)
        required: false
        default: full
        type: choice
        options:
          - full
          - recovery
          - native-lifecycle
      host:
        description: Optional host filter (full keeps every job's existing hosts)
        required: false
        default: full
        type: choice
        options:
          - full
          - windows-latest
          - ubuntu-latest
          - macos-latest
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT: ${{ github.workspace }}/qualification-evidence

jobs:
  native-lifecycle:
    name: Native lifecycle qualification (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'runner-v2-qualification')
      && (github.event_name != 'workflow_dispatch' || inputs.job == 'full' || inputs.job == 'native-lifecycle')
      && (github.event_name != 'workflow_dispatch' || inputs.host == 'full' || inputs.host == matrix.os)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare qualification evidence root
        shell: bash
        run: mkdir -p "$RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT/native-lifecycle"
      - name: Run focused native lifecycle qualification
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/qualification/native-lifecycle.test.ts
      - name: Upload native lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-native-lifecycle-${{ matrix.os }}-node${{ matrix.node-version }}
          path: qualification-evidence
          if-no-files-found: ignore
          retention-days: 14

  cli-readiness:
    name: CLI readiness qualification (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'runner-v2-qualification')
      && (github.event_name != 'workflow_dispatch' || inputs.job == 'full')
      && (github.event_name != 'workflow_dispatch' || inputs.host == 'full' || inputs.host == matrix.os)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare qualification evidence root
        shell: bash
        run: mkdir -p "$RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT/cli-readiness"
      - name: Run focused CLI readiness and config-trust qualification
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/qualification/cli-readiness.test.ts
      - name: Upload CLI readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-cli-readiness-${{ matrix.os }}-node${{ matrix.node-version }}
          path: qualification-evidence
          if-no-files-found: ignore
          retention-days: 14

  recovery:
    name: Recovery qualification (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'runner-v2-qualification')
      && (github.event_name != 'workflow_dispatch' || inputs.job == 'full' || inputs.job == 'recovery')
      && (github.event_name != 'workflow_dispatch' || inputs.host == 'full' || inputs.host == matrix.os)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare qualification evidence root
        shell: bash
        run: mkdir -p "$RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT/recovery"
      - name: Run focused restart and recovery qualification
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/qualification/recovery.test.ts
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-recovery-${{ matrix.os }}-node${{ matrix.node-version }}
          path: qualification-evidence
          if-no-files-found: ignore
          retention-days: 14

  windows-portable-channel:
    name: Windows portable channel qualification (Node ${{ matrix.node-version }})
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'runner-v2-qualification')
      && (github.event_name != 'workflow_dispatch' || inputs.job == 'full')
      && (github.event_name != 'workflow_dispatch' || inputs.host == 'full' || inputs.host == 'windows-latest')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare qualification evidence root
        shell: bash
        run: mkdir -p "$RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT/windows-portable"
      - name: Run focused Windows portable channel qualification
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/qualification/windows-portable-channel.test.ts
      - name: Upload Windows portable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-windows-portable-node${{ matrix.node-version }}
          path: qualification-evidence
          if-no-files-found: ignore
          retention-days: 14

  docker-oci-integration:
    name: Docker OCI qualification (Linux, Node ${{ matrix.node-version }})
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'runner-v2-qualification')
      && (github.event_name != 'workflow_dispatch' || inputs.job == 'full')
      && (github.event_name != 'workflow_dispatch' || inputs.host == 'full' || inputs.host == 'ubuntu-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Docker daemon
        run: docker info
      - name: Prepare immutable fixture images
        run: |
          docker pull alpine:latest
          docker pull node:24-slim
      - name: Prepare qualification evidence root
        shell: bash
        run: mkdir -p "$RUNNER_V2_QUALIFICATION_EVIDENCE_ROOT/docker-oci"
      - name: Run focused Docker OCI qualification
        env:
          RUNNER_V2_REQUIRE_DOCKER: "1"
        run: >-
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=1
          runner-v2/test/qualification/docker-oci.test.ts
      - name: Upload Docker OCI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-docker-oci-node${{ matrix.node-version }}
          path: qualification-evidence
          if-no-files-found: ignore
          retention-days: 14
